name: Logic tests

on:
  push:
  pull_request:

jobs:
  dotnet:
    name: Plain C# logic + EditMode tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run tests
        run: dotnet test tools/LogicTests/LogicTests.csproj --logger "console;verbosity=normal"
